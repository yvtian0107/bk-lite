            iconSource: builtin
            iconKey: cc-default
          dataSource: 模型/实例/分类总数统计::cmdb/get_cmdb_statistics
          interaction:
            kind: title
            name: 资源概览
            url: /cmdb/assetOverview
            openMode: newTab
          filterBindings:
            organization__string: true
          selectedFields:
          - instance_count
          thresholdColors:
          - color: '#366ce4'
            value: '70'
          - color: '#366ce4'
            value: '30'
